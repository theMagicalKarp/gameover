<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Vendored from https://avatars.githubusercontent.com/u/2288912 so the
         icon doesn't depend on GitHub being reachable. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>GAME OVER — NES</title>
    <meta
      name="description"
      content="An in-browser player for the GAME OVER NES ROM, an audio-visual demo built with cc65 and neslib."
    />
  </head>
  <body>
    <div class="stage">
      <!-- The NES framebuffer. CSS scales it up; the backing store stays
           256x240 and is written to directly. -->
      <canvas id="screen" class="stage__screen" width="256" height="240"></canvas>

      <!-- Browsers won't let an AudioContext start without a user gesture, so
           the ROM can't boot with sound until something is clicked. -->
      <button id="start" class="start" type="button" hidden>
        <span aria-hidden="true">▶</span>
      </button>

      <p id="error" class="error" role="alert" hidden></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
